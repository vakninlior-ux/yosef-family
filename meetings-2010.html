  .gallery-wrap { max-width: 1100px; margin: 0 auto; padding: 0 16px 56px; }

<script>
(function () {
  var photos = ['DSC_0011.JPG','DSC_0012.JPG','DSC_0013.JPG','DSC_0014.JPG','DSC_0015.JPG','DSC_0016.JPG','DSC_0017.JPG','DSC_0018.JPG','DSC_0022.JPG','DSC_0023.JPG','DSC_0024.JPG','DSC_0025.JPG','DSC_0026.JPG','DSC_0028.JPG','DSC_0029.JPG','DSC_0030.JPG','DSC_0031.JPG','DSC_0033.JPG','DSC_0035.JPG','DSC_0037.JPG','DSC_0045.JPG','DSC_0046.JPG','DSC_0048.JPG','DSC_0052.JPG','DSC_0054.JPG','DSC_0056.JPG','DSC_0875.JPG','DSC_0876.JPG','DSC_0877.JPG','DSC_0878.JPG','DSC_0879.JPG','DSC_0884.JPG','DSC_0885.JPG','DSC_0886.JPG','DSC_0887.JPG','DSC_0889.JPG','DSC_0890.JPG','DSC_0891.JPG','DSC_0892.JPG','DSC_0900.JPG','DSC_0903.JPG','DSC_0904.JPG','DSC_0907.JPG','DSC_0908.JPG','DSC_0909.JPG','DSC_0912.JPG','DSC_0914.JPG','DSC_0919.JPG','DSC_0921.JPG','DSC_0922.JPG','DSC_0924.JPG','DSC_0925.JPG','DSC_0927.JPG','DSC_0928.JPG','DSC_0932.JPG','DSC_0935.JPG','DSC_0939.JPG','DSC_0943.JPG','DSC_0944.JPG','DSC_0950.JPG','DSC_0956.JPG','DSC_0958.JPG','DSC_0962.JPG','DSC_0967.JPG','DSC_0971.JPG','DSC_0979.JPG','DSC_0981.JPG','DSC_0983.JPG','DSC_0987.JPG','DSC_0988.JPG','DSC_0991.JPG','DSC_0993.JPG','DSC_0994.JPG','DSC_0996.JPG','DSC_0999.JPG','DSC_1000.JPG','DSC_1001.JPG','DSC_1002.JPG','DSC_1003.JPG','DSC_1004.JPG','DSC_1005.JPG','DSC_1008.JPG','DSC_1010.JPG','DSC_1011.JPG','DSC_1013.JPG','DSC_1015.JPG','DSC_1017.JPG','DSC_1021.JPG','DSC_1022.JPG'];
  var base = 'assets/photos-2010/';
  var cur = 0;
  var gal = document.getElementById('gal2010');
  var lb  = document.getElementById('lb');
  var lbImg = document.getElementById('lb-img');
  var lbCnt = document.getElementById('lb-counter');

  photos.forEach(function (f, i) {
    var img = document.createElement('img');
    img.src = base + f;
    img.alt = 'תמונה ' + (i + 1) + ' מכנס יוסף 2010';
    img.loading = 'lazy';
    img.addEventListener('click', function () { open(i); });
    gal.appendChild(img);
  });

  function open(i) {
    cur = i;
    lbImg.src = base + photos[cur];
    lbCnt.textContent = (cur + 1) + ' / ' + photos.length;
    lb.hidden = false;
    document.body.style.overflow = 'hidden';
  }
  function close() { lb.hidden = true; document.body.style.overflow = ''; lbImg.src = ''; }
  function prev() { cur = (cur - 1 + photos.length) % photos.length; lbImg.src = base + photos[cur]; lbCnt.textContent = (cur + 1) + ' / ' + photos.length; }
  function next() { cur = (cur + 1) % photos.length; lbImg.src = base + photos[cur]; lbCnt.textContent = (cur + 1) + ' / ' + photos.length; }

  document.getElementById('lb-close').addEventListener('click', close);
  document.getElementById('lb-prev').addEventListener('click', prev);
  document.getElementById('lb-next').addEventListener('click', next);
  lb.addEventListener('click', function (e) { if (e.target === lb) close(); });
  document.addEventListener('keydown', function (e) {
    if (lb.hidden) return;
    if (e.key === 'Escape') close();
    if (e.key === 'ArrowLeft') next();
    if (e.key === 'ArrowRight') prev();
  });
})();
</script>
