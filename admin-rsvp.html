<style>
  .admin-wrap { max-width: 820px; margin: 0 auto; padding: 8px 16px 48px; }
  #admin-status { font-size: 0.8rem; color: var(--muted); margin: 0 0 12px; }
  #admin-total { background: var(--card); border: 1px solid var(--rule); border-inline-start: 5px solid var(--c-conference); border-radius: 3px; padding: 10px 16px; margin: 0 0 20px; font-weight: 600; font-size: 15px; }
  .ab-row { background: var(--card); border: 1px solid var(--rule); border-radius: 4px; padding: 12px 16px; margin-bottom: 10px; transition: background-color .4s; }
  .ab-row.ab-flash { background-color: #ede9fe; }
  .ab-name { font-family: var(--serif); font-size: 1rem; font-weight: 700; margin-bottom: 8px; color: var(--c-conference); }
  .ab-bar-w { height: 6px; background: var(--rule); border-radius: 999px; overflow: hidden; margin-bottom: 8px; }
  .ab-bar { height: 100%; background: #22c55e; border-radius: 999px; transition: width .5s ease; }
  details summary { list-style: none; cursor: pointer; }
  details summary::-webkit-details-marker { display: none; }
  .ab-summary { display: flex; gap: 10px; align-items: center; padding: 2px 0; font-size: 0.82rem; }
  .ab-summary::after { content: '▸ פתח'; color: var(--muted); font-size: 0.7rem; margin-inline-start: auto; }
  details[open] .ab-summary::after { content: '▾ סגור'; }
  .ab-y { color: #16a34a; font-weight: 700; }
  .ab-n { color: var(--c-death); font-weight: 700; }
  .ab-p { color: var(--muted); }
  .ab-people { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 5px 10px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--rule); }
  .ab-person { display: flex; align-items: center; gap: 5px; font-size: 0.8rem; }
  .ab-ps { font-size: 0.75rem; font-weight: 700; width: 14px; text-align: center; flex-shrink: 0; }
  .ab-ps.yes  { color: #16a34a; }
  .ab-ps.no   { color: var(--c-death); }
  .ab-ps.pend { color: var(--muted); }
</style>
